[package]
name = "vrc-recorder"
version = "0.1.0"
edition = "2024"
description = "Receive and record Spout video streams on Windows"

[dependencies]
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.17"
raw-window-handle = "0.6"

egui = "0.34"
egui_glow = { version = "0.34", features = ["winit"] }

spout-rs = "0.1"
cpal = "0.15"

chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
bytemuck = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[target.'cfg(windows)'.dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
