[package]
name = "vrc-recorder"
version = "0.2.0"
edition = "2024"
description = "Receive and record Spout video streams on Windows"

[dependencies]
# Window/GL (hidden render window + Spout GPU interop)
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.17"
raw-window-handle = "0.6"

# Tauri v2 (WebView UI)
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Spout
spout-rs = "0.1"

# Recording
cpal = "0.15"
rosc = "0.11"

# Preview JPEG encoding
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

# Utilities
chrono = "0.4"
dirs = "6"
bytemuck = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[target.'cfg(windows)'.dependencies]

[build-dependencies]
tauri-build = { version = "2", features = [] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
